<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 210" role="img" aria-label="UML-Klasse Messung mit Attributen wert und einheit sowie Methode validiere">
<style>text{font-family:'DIN Pro','DINPro',Arial,sans-serif;font-size:22px;font-variant-ligatures:none}.h{font-weight:500;text-anchor:middle}.m{text-anchor:start}</style>
<rect x="10" y="10" width="380" height="190" fill="var(--paper, #F7F8F9)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
<line x1="10" y1="56" x2="390" y2="56" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
<line x1="10" y1="144" x2="390" y2="144" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
<text class="h" x="200" y="42" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Messung</text>
<text class="m" x="28" y="90" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">+ wert: float</text>
<text class="m" x="28" y="125" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">+ einheit: str</text>
<text class="m" x="28" y="181" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">+ validiere(): bool</text>
</svg>
