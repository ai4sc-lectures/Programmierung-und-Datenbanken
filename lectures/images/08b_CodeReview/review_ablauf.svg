<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Prüfreihenfolge: 1 Aufgabe, 2 Tests, 3 Änderungen, 4 Ausführung">
<defs>
<style>text{font-family:'DIN Pro','DINPro',Arial,sans-serif;font-size:24px;font-variant-ligatures:none}.t{font-weight:500;text-anchor:middle;dominant-baseline:middle}.s{font-size:20px;text-anchor:middle;dominant-baseline:middle}</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink, #0B0D10)"/></marker>
</defs>
<rect x="100" y="20" width="300" height="110" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
<rect x="500" y="20" width="300" height="110" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
<rect x="500" y="230" width="300" height="110" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
<rect x="100" y="230" width="300" height="110" fill="var(--signal-blue-50, #8FA0FF)" fill-opacity="0.35" stroke="var(--signal-blue, #1E40FF)" stroke-width="3"/>
<text class="t" x="250" y="62" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">1 Aufgabe</text>
<text class="s" x="250" y="100" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Was war verlangt?</text>
<text class="t" x="650" y="62" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">2 Tests</text>
<text class="s" x="650" y="100" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Prüfen sie die Anforderung?</text>
<text class="t" x="650" y="272" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">3 Änderungen</text>
<text class="s" x="650" y="310" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Was wurde geändert?</text>
<text class="t" x="250" y="272" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">4 Ausführung</text>
<text class="s" x="250" y="310" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Läuft es mit Randwerten?</text>
<line x1="402" y1="75" x2="498" y2="75" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<line x1="650" y1="132" x2="650" y2="227" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<line x1="498" y1="285" x2="402" y2="285" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
</svg>
