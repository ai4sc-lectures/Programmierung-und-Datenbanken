<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Ablauf: Der Agent generiert den Code, eine Prüfer-KI mit neuem Kontext sucht Fehler, die Funde sind Hinweise, du führst den Code aus und entscheidest, ein Mangel geht zurück an den Agenten">
<defs>
<style>text{font-family:'DIN Pro','DINPro',Arial,sans-serif;font-size:20px;font-variant-ligatures:none}.t{font-size:24px;font-weight:500;text-anchor:middle;dominant-baseline:middle}.s{text-anchor:middle;dominant-baseline:middle}.l{text-anchor:start;dominant-baseline:middle}</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink, #0B0D10)"/></marker>
</defs>
<rect x="60" y="20" width="320" height="130" fill="var(--pastello-sage, #8B9E87)"/>
<rect x="520" y="20" width="320" height="130" fill="var(--pastello-violet, #A398BC)"/>
<rect x="520" y="250" width="320" height="130" fill="var(--pastello-amber, #D6B65E)"/>
<rect x="60" y="250" width="320" height="130" fill="var(--pastello-blue, #91B5CB)"/>
<text class="t" x="220" y="62" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">1 Agent</text>
<text class="s" x="220" y="104" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">generiert den Code</text>
<text class="t" x="680" y="52" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">2 Prüfer-KI</text>
<text class="s" x="680" y="88" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">neuer Kontext:</text>
<text class="s" x="680" y="116" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Aufgabe, Code, Tests</text>
<text class="t" x="680" y="282" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">3 Funde</text>
<text class="s" x="680" y="324" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Hinweise, kein Nachweis</text>
<text class="t" x="220" y="282" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">4 Du</text>
<text class="s" x="220" y="318" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">führst den Code aus</text>
<text class="s" x="220" y="346" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">und entscheidest</text>
<line x1="382" y1="85" x2="518" y2="85" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<line x1="680" y1="152" x2="680" y2="248" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<line x1="518" y1="315" x2="382" y2="315" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<line x1="220" y1="248" x2="220" y2="152" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<text class="l" x="236" y="200" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Mangel zurückgeben</text>
</svg>
