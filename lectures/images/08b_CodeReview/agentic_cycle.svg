<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-label="Agentic Cycle: Prompt, Generate, Understand, Verify (Code Review), Iterate">
  <defs>
    <style>
      text { font-family: 'DIN Pro','DINPro',Arial,sans-serif; }
      .n   { font-size:18px; font-weight:500; fill:var(--ink, #0B0D10);          text-anchor:middle; dominant-baseline:middle; }
      .nb  { font-size:18px; font-weight:500; fill:var(--signal-blue, #1E40FF);  text-anchor:middle; dominant-baseline:middle; }
      .st  { font-size:13px; fill:var(--concrete, #6F7479);                      text-anchor:middle; dominant-baseline:middle; }
      .lp  { font-size:13px; fill:var(--signal-red, #E1261C);                    text-anchor:middle; dominant-baseline:middle; }
      .arr { stroke:var(--concrete, #6F7479); stroke-width:2; fill:none; }
    </style>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--concrete, #6F7479)"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--signal-red, #E1261C)"/>
    </marker>
  </defs>

  <!-- boxes -->
  <rect x="10"  y="80" width="150" height="80" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
  <rect x="215" y="80" width="150" height="80" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
  <rect x="420" y="80" width="150" height="80" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
  <rect x="625" y="80" width="170" height="80" fill="var(--signal-blue-50, #8FA0FF)" fill-opacity="0.25" stroke="var(--signal-blue, #1E40FF)" stroke-width="3"/>
  <rect x="850" y="80" width="140" height="80" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>

  <!-- labels -->
  <text class="n"  x="85"  y="112">Prompt</text>
  <text class="st" x="85"  y="136">Anforderung</text>
  <text class="n"  x="290" y="112">Generate</text>
  <text class="st" x="290" y="136">KI erzeugt Code</text>
  <text class="n"  x="495" y="112">Understand</text>
  <text class="st" x="495" y="136">Code lesen</text>
  <text class="nb" x="710" y="112">Verify</text>
  <text class="st" x="710" y="136">Code Review</text>
  <text class="n"  x="920" y="112">Iterate</text>
  <text class="st" x="920" y="136">bei Fehler</text>

  <!-- forward arrows -->
  <line class="arr" x1="162" y1="120" x2="212" y2="120" marker-end="url(#ah)"/>
  <line class="arr" x1="367" y1="120" x2="417" y2="120" marker-end="url(#ah)"/>
  <line class="arr" x1="572" y1="120" x2="622" y2="120" marker-end="url(#ah)"/>
  <line class="arr" x1="797" y1="120" x2="847" y2="120" marker-end="url(#ah)"/>

  <!-- loop back: Iterate -> Generate -->
  <path d="M920,162 L920,235 L290,235 L290,164" fill="none" stroke="var(--signal-red, #E1261C)" stroke-width="2" marker-end="url(#ahr)"/>
  <text class="lp" x="605" y="256">Review schlägt fehl: Prompt präzisieren, neu generieren</text>
</svg>
