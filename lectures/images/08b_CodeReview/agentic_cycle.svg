<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Agentic Cycle: Prompt, Generieren, Verstehen, Verifizieren (Code Review), Iterieren zurück zu Generieren">
<defs>
<style>text{font-family:'DIN Pro','DINPro',Arial,sans-serif;font-size:24px;font-variant-ligatures:none}.t{font-weight:500;text-anchor:middle;dominant-baseline:middle}.s{font-size:20px;text-anchor:middle;dominant-baseline:middle}</style>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink, #0B0D10)"/></marker>
</defs>
<rect x="10" y="20" width="250" height="110" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
<rect x="325" y="20" width="250" height="110" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
<rect x="640" y="20" width="250" height="110" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
<rect x="640" y="230" width="250" height="110" fill="var(--signal-blue-50, #8FA0FF)" fill-opacity="0.35" stroke="var(--signal-blue, #1E40FF)" stroke-width="3"/>
<rect x="325" y="230" width="250" height="110" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="2"/>
<text class="t" x="135" y="75" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Prompt</text>
<text class="t" x="450" y="75" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Generieren</text>
<text class="t" x="765" y="75" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Verstehen</text>
<text class="t" x="765" y="270" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Verifizieren</text>
<text class="s" x="765" y="308" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Code Review</text>
<text class="t" x="450" y="270" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">Iterieren</text>
<text class="s" x="450" y="308" fill="var(--ink, #0B0D10)" style="font-variant-ligatures:none">bei Fehler</text>
<line x1="262" y1="75" x2="322" y2="75" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<line x1="577" y1="75" x2="637" y2="75" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<line x1="765" y1="132" x2="765" y2="227" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<line x1="638" y1="285" x2="578" y2="285" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
<line x1="450" y1="227" x2="450" y2="133" stroke="var(--ink, #0B0D10)" stroke-width="2" marker-end="url(#a)"/>
</svg>
