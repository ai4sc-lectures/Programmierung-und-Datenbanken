<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="'DIN Pro','DINPro',Arial,sans-serif">
  <style>
    text { font-family: 'DIN Pro','DINPro',Arial,sans-serif; }
    .lbl { font-size: 13px; fill: #888; text-anchor: end;    dominant-baseline: middle; }
    .hdr { font-size: 11px; fill: #bbb; text-anchor: middle; dominant-baseline: middle; }
    .n   { font-size: 16px; font-weight: 500; fill: #222;    text-anchor: middle; dominant-baseline: middle; }
    .na  { font-size: 16px; font-weight: 500; fill: #1e40af; text-anchor: middle; dominant-baseline: middle; }
    .ng  { font-size: 16px; font-weight: 500; fill: #aaa;    text-anchor: middle; dominant-baseline: middle; }
    .nk  { font-size: 16px; font-weight: 500; fill: #14532d; text-anchor: middle; dominant-baseline: middle; }
    .ann { font-size: 11px; fill: #78350f; text-anchor: start; dominant-baseline: middle; }
    .ann2{ font-size: 11px; fill: #aaa;    text-anchor: start; dominant-baseline: middle; }
    .st  { font-size: 12px; fill: #555; text-anchor: middle; dominant-baseline: middle; }
    .dec { font-size: 12px; fill: #1e40af; text-anchor: start; dominant-baseline: middle; }
  </style>

  <!--
    cols Bit4..Bit0: cx=200 240 280 320 360  step=40
    box 32x32
    label col: x=148 text-anchor:end
    annotation col: x=372
    rows cy:
      hdr     20
      A       65
      B       105
      sep1    127
      decomp  155   (text: 5 = 2²+2⁰ = 4+1)
      sep1b   175
      P0      210   A<<0 = A×1  (active)
      P1      250   A<<1 = A×2  (skip)
      P2      290   A<<2 = A×4  (active)
      sep2    312
      result  347
      status  385
  -->

  <!-- col headers -->
  <text class="hdr" x="200" y="20">Bit 4</text>
  <text class="hdr" x="240" y="20">Bit 3</text>
  <text class="hdr" x="280" y="20">Bit 2</text>
  <text class="hdr" x="320" y="20">Bit 1</text>
  <text class="hdr" x="360" y="20">Bit 0</text>

  <!-- row labels -->
  <text class="lbl" x="148" y="65">A = 3</text>
  <text class="lbl" x="148" y="105">B = 5</text>
  <text class="lbl" x="148" y="210">A &lt;&lt; 0 = A×1</text>
  <text class="lbl" x="148" y="250">A &lt;&lt; 1 = A×2</text>
  <text class="lbl" x="148" y="290">A &lt;&lt; 2 = A×4</text>
  <text class="lbl" x="148" y="347">= 15</text>

  <!-- separators -->
  <line x1="152" y1="127" x2="384" y2="127" stroke="#ccc" stroke-width="1.5"/>
  <line x1="152" y1="175" x2="384" y2="175" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="152" y1="312" x2="384" y2="312" stroke="#ccc" stroke-width="1.5"/>

  <!-- A = 00011 -->
  <rect x="184" y="49" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="n" x="200" y="65">0</text>
  <rect x="224" y="49" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="n" x="240" y="65">0</text>
  <rect x="264" y="49" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="n" x="280" y="65">0</text>
  <rect x="304" y="49" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="n" x="320" y="65">1</text>
  <rect x="344" y="49" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="n" x="360" y="65">1</text>

  <!-- B = 00101, Bit2 and Bit0 highlighted static -->
  <rect x="184" y="89" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="n" x="200" y="105">0</text>
  <rect x="224" y="89" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="n" x="240" y="105">0</text>
  <rect x="264" y="89" width="32" height="32" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.75"/><text class="n" fill="#78350f" x="280" y="105">1</text>
  <rect x="304" y="89" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="n" x="320" y="105">0</text>
  <rect x="344" y="89" width="32" height="32" rx="4" fill="#fef3c7" stroke="#fcd34d" stroke-width="0.75"/><text class="n" fill="#78350f" x="360" y="105">1</text>

  <!-- decomposition: left part right-aligned to x=185, "=..." left-aligned from x=187 -->
  <text x="230" y="138" font-size="13" fill="#78350f" dominant-baseline="middle" text-anchor="end">5</text>
  <text x="232" y="138" font-size="13" fill="#78350f" dominant-baseline="middle" text-anchor="start">= 2² + 2⁰ = 4 + 1</text>
  <text x="230" y="154" font-size="13" fill="#78350f" dominant-baseline="middle" text-anchor="end">3×5</text>
  <text x="232" y="154" font-size="13" fill="#78350f" dominant-baseline="middle" text-anchor="start">= 3×4 + 3×1</text>
  <text x="230" y="170" font-size="13" fill="#78350f" dominant-baseline="middle" text-anchor="end">3×5</text>
  <text x="232" y="170" font-size="13" fill="#78350f" dominant-baseline="middle" text-anchor="start">= (3&lt;&lt;2) + (3&lt;&lt;0)</text>

  <!-- ======= STEP 0: A<<0 = ×1, B[0]=1, ADD, t=0.5s ======= -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    <rect x="184" y="194" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="ng" x="200" y="210">0</text>
    <rect x="224" y="194" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="ng" x="240" y="210">0</text>
    <rect x="264" y="194" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="ng" x="280" y="210">0</text>
    <rect x="304" y="194" width="32" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.75"/><text class="na" x="320" y="210">1</text>
    <rect x="344" y="194" width="32" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.75"/><text class="na" x="360" y="210">1</text>
    <text class="ann" x="388" y="210">+ (B[0]=1, ×1)</text>
  </g>

  <!-- ======= STEP 1: A<<1 = ×2, B[1]=0, SKIP, t=1s ======= -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.3s" begin="1s" fill="freeze"/>
    <rect x="184" y="234" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#eee" stroke-width="0.75"/><text class="ng" x="200" y="250">0</text>
    <rect x="224" y="234" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#eee" stroke-width="0.75"/><text class="ng" x="240" y="250">0</text>
    <rect x="264" y="234" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#eee" stroke-width="0.75"/><text class="ng" x="280" y="250">1</text>
    <rect x="304" y="234" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#eee" stroke-width="0.75"/><text class="ng" x="320" y="250">1</text>
    <rect x="344" y="234" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#eee" stroke-width="0.75"/><text class="ng" x="360" y="250">0</text>
    <text class="ann2" x="388" y="250">– (B[1]=0, ×2)</text>
  </g>

  <!-- ======= STEP 2: A<<2 = ×4, B[2]=1, ADD, t=1.5s ======= -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    <rect x="184" y="274" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="ng" x="200" y="290">0</text>
    <rect x="224" y="274" width="32" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.75"/><text class="na" x="240" y="290">1</text>
    <rect x="264" y="274" width="32" height="32" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="0.75"/><text class="na" x="280" y="290">1</text>
    <rect x="304" y="274" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="ng" x="320" y="290">0</text>
    <rect x="344" y="274" width="32" height="32" rx="4" fill="#f5f5f5" stroke="#ccc" stroke-width="0.75"/><text class="ng" x="360" y="290">0</text>
    <text class="ann" x="388" y="290">+ (B[2]=1, ×4)</text>
  </g>

  <!-- ======= RESULT = 01111, t=2.2s ======= -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.4s" begin="2.2s" fill="freeze"/>
    <rect x="184" y="331" width="32" height="32" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.75"/><text class="nk" x="200" y="347">0</text>
    <rect x="224" y="331" width="32" height="32" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.75"/><text class="nk" x="240" y="347">1</text>
    <rect x="264" y="331" width="32" height="32" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.75"/><text class="nk" x="280" y="347">1</text>
    <rect x="304" y="331" width="32" height="32" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.75"/><text class="nk" x="320" y="347">1</text>
    <rect x="344" y="331" width="32" height="32" rx="4" fill="#dcfce7" stroke="#86efac" stroke-width="0.75"/><text class="nk" x="360" y="347">1</text>
  </g>

  <!-- status -->
  <text class="st" x="270" y="385" opacity="0">
    00011 + 01100 = 01111 = 15 ✓
    <animate attributeName="opacity" values="0;1" keyTimes="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
  </text>

</svg>
