<svg width="100%" height="auto" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="DIN Pro Regular,DIN Pro Regular_MSFontService,sans-serif" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--signal-red, #E1261C)"/>
    </marker>
  </defs>
  <style>svg{display:block;width:100%;height:auto}text{font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0}</style>
  <!-- RAM -->
  <rect x="20" y="20" width="560" height="520" rx="6" fill="var(--bone, #FFFFFF)" stroke="var(--ink, #0B0D10)" stroke-width="3"/>
  <rect x="20" y="20" width="560" height="44" rx="6" fill="var(--ink, #0B0D10)"/>
  <text x="40" y="51" font-size="26" fill="var(--bone, #FFFFFF)" font-variant-ligatures="none">RAM – Adresse und Inhalt</text>
  <text x="40" y="92" font-size="20" fill="var(--concrete, #6F7479)" font-variant-ligatures="none">Programm (Befehle)</text>
  <g font-size="22" font-variant-ligatures="none">
    <rect x="40" y="102" width="520" height="48" fill="var(--paper, #F7F8F9)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
    <text x="56" y="134" fill="var(--ink, #0B0D10)">0x0001</text><text x="170" y="134" fill="var(--ink, #0B0D10)">LOAD  R1, [0x0A10]</text>
    <rect x="40" y="150" width="520" height="48" fill="var(--paper, #F7F8F9)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
    <text x="56" y="182" fill="var(--ink, #0B0D10)">0x0002</text><text x="170" y="182" fill="var(--ink, #0B0D10)">LOAD  R2, [0x0A11]</text>
    <rect x="40" y="198" width="520" height="48" fill="var(--signal-yellow-50, #FAE280)" stroke="var(--ink, #0B0D10)" stroke-width="3"/>
    <text x="56" y="230" fill="var(--ink, #0B0D10)">0x0003</text><text x="170" y="230" fill="var(--ink, #0B0D10)">ADD   R3, R1, R2</text>
    <rect x="40" y="246" width="520" height="48" fill="var(--paper, #F7F8F9)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
    <text x="56" y="278" fill="var(--ink, #0B0D10)">0x0004</text><text x="170" y="278" fill="var(--ink, #0B0D10)">STORE [0x0A12], R3</text>
  </g>
  <text x="40" y="338" font-size="20" fill="var(--concrete, #6F7479)" font-variant-ligatures="none">Daten (Variablen)</text>
  <g font-size="22" font-variant-ligatures="none">
    <rect x="40" y="348" width="520" height="48" fill="var(--bone, #FFFFFF)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
    <rect x="52" y="360" width="24" height="24" fill="none" stroke="var(--signal-blue, #1E40FF)" stroke-width="3"/>
    <text x="92" y="380" fill="var(--ink, #0B0D10)">0x0A10</text><text x="200" y="380" fill="var(--ink, #0B0D10)">00000101</text><text x="360" y="380" fill="var(--ink, #0B0D10)">x = 5</text>
    <rect x="40" y="396" width="520" height="48" fill="var(--bone, #FFFFFF)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
    <rect x="52" y="408" width="24" height="24" fill="none" stroke="var(--signal-blue, #1E40FF)" stroke-width="3"/>
    <text x="92" y="428" fill="var(--ink, #0B0D10)">0x0A11</text><text x="200" y="428" fill="var(--ink, #0B0D10)">00000011</text><text x="360" y="428" fill="var(--ink, #0B0D10)">y = 3</text>
    <rect x="40" y="444" width="520" height="48" fill="var(--bone, #FFFFFF)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
    <rect x="52" y="456" width="24" height="24" fill="none" stroke="var(--signal-blue, #1E40FF)" stroke-width="3"/>
    <text x="92" y="476" fill="var(--ink, #0B0D10)">0x0A12</text><text x="200" y="476" fill="var(--ink, #0B0D10)">00000000</text><text x="360" y="476" fill="var(--ink, #0B0D10)">z (noch leer)</text>
  </g>
  <rect x="40" y="504" width="16" height="16" fill="none" stroke="var(--signal-blue, #1E40FF)" stroke-width="3"/>
  <text x="66" y="519" font-size="18" fill="var(--concrete, #6F7479)" font-variant-ligatures="none">= Zelle einer Variablen</text>
  <!-- CPU -->
  <rect x="640" y="20" width="340" height="520" rx="6" fill="var(--bone, #FFFFFF)" stroke="var(--ink, #0B0D10)" stroke-width="3"/>
  <rect x="640" y="20" width="340" height="44" rx="6" fill="var(--ink, #0B0D10)"/>
  <text x="660" y="51" font-size="26" fill="var(--bone, #FFFFFF)" font-variant-ligatures="none">CPU</text>
  <text x="660" y="92" font-size="20" fill="var(--concrete, #6F7479)" font-variant-ligatures="none">Instruction Pointer</text>
  <rect x="660" y="102" width="300" height="48" fill="var(--signal-yellow-50, #FAE280)" stroke="var(--signal-red, #E1261C)" stroke-width="3"/>
  <text x="676" y="134" font-size="22" fill="var(--ink, #0B0D10)" font-variant-ligatures="none">IP = 0x0003</text>
  <text x="660" y="196" font-size="20" fill="var(--concrete, #6F7479)" font-variant-ligatures="none">Register</text>
  <g font-size="22" font-variant-ligatures="none">
    <rect x="660" y="206" width="300" height="48" fill="var(--paper, #F7F8F9)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
    <rect x="670" y="218" width="24" height="24" fill="none" stroke="var(--signal-blue, #1E40FF)" stroke-width="3"/>
    <text x="706" y="238" fill="var(--ink, #0B0D10)">R1 = 00000101</text>
    <rect x="660" y="254" width="300" height="48" fill="var(--paper, #F7F8F9)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
    <rect x="670" y="266" width="24" height="24" fill="none" stroke="var(--signal-blue, #1E40FF)" stroke-width="3"/>
    <text x="706" y="286" fill="var(--ink, #0B0D10)">R2 = 00000011</text>
    <rect x="660" y="302" width="300" height="48" fill="var(--paper, #F7F8F9)" stroke="var(--ink, #0B0D10)" stroke-width="2"/>
    <text x="706" y="334" fill="var(--concrete, #6F7479)">R3 = ?</text>
  </g>
  <rect x="660" y="390" width="300" height="100" fill="var(--ink, #0B0D10)"/>
  <text x="810" y="430" font-size="26" fill="var(--bone, #FFFFFF)" text-anchor="middle" font-variant-ligatures="none">ALU</text>
  <text x="810" y="466" font-size="20" fill="var(--bone, #FFFFFF)" text-anchor="middle" font-variant-ligatures="none">R1 + R2 → R3</text>
  <!-- IP points to current instruction -->
  <path d="M660,126 L620,126 L620,222 L564,222" fill="none" stroke="var(--signal-red, #E1261C)" stroke-width="4" marker-end="url(#arr)"/>
</svg>
