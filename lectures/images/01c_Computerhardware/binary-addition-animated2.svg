<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<style>
text { font-family: Arial, sans-serif; }
.bit { font-size: 42px; font-weight: bold; text-anchor: middle; }
.label { font-size: 26px; }
.carry { fill: #c62828; opacity: 0; font-size: 34px; font-weight: bold; text-anchor: middle; }
.result { fill: #1565c0; opacity: 0; font-size: 42px; font-weight: bold; text-anchor: middle; }

#c0 { animation: show 1s 1s forwards; }
#r0 { animation: show 1s 2s forwards; }

#c1 { animation: show 1s 3s forwards; }
#r1 { animation: show 1s 4s forwards; }

#c2 { animation: show 1s 5s forwards; }
#r2 { animation: show 1s 6s forwards; }

#c3 { animation: show 1s 7s forwards; }
#r3 { animation: show 1s 8s forwards; }

#r4 { animation: show 1s 9s forwards; }
#final { animation: show 1s 10s forwards; }

.arrow { stroke:#c62828; stroke-width:3; fill:none; opacity:0; }
#a0 { animation: show 1s 1s forwards; }
#a1 { animation: show 1s 3s forwards; }
#a2 { animation: show 1s 5s forwards; }
#a3 { animation: show 1s 7s forwards; }

@keyframes show {
  from { opacity:0; }
  to   { opacity:1; }
}
</style>

<text x="170" y="60" class="label" text-anchor="end">Übertrag</text>
<text x="170" y="150" class="label" text-anchor="end">11 → 1011₂</text>
<text x="170" y="220" class="label" text-anchor="end">6 → 0110₂</text>
<text x="170" y="290" class="label" text-anchor="end">Ergebnis</text>

<line x1="180" y1="240" x2="860" y2="240" stroke="black" stroke-width="2"/>

<text x="820" y="90" class="carry" id="c0">1</text>
<text x="700" y="90" class="carry" id="c1">1</text>
<text x="580" y="90" class="carry" id="c2">1</text>
<text x="460" y="90" class="carry" id="c3">1</text>

<path id="a0" class="arrow" d="M820 105 L760 105"/>
<path id="a1" class="arrow" d="M700 105 L640 105"/>
<path id="a2" class="arrow" d="M580 105 L520 105"/>
<path id="a3" class="arrow" d="M460 105 L400 105"/>

<text x="460" y="180" class="bit">1</text>
<text x="580" y="180" class="bit">0</text>
<text x="700" y="180" class="bit">1</text>
<text x="820" y="180" class="bit">1</text>

<text x="460" y="220" class="bit">0</text>
<text x="580" y="220" class="bit">1</text>
<text x="700" y="220" class="bit">1</text>
<text x="820" y="220" class="bit">0</text>

<text x="820" y="320" class="result" id="r0">1</text>
<text x="700" y="320" class="result" id="r1">0</text>
<text x="580" y="320" class="result" id="r2">0</text>
<text x="460" y="320" class="result" id="r3">0</text>
<text x="340" y="320" class="result" id="r4">1</text>

<text x="500" y="390" class="result" id="final">1011₂ + 0110₂ = 10001₂ = 17₁₀</text>
</svg>
