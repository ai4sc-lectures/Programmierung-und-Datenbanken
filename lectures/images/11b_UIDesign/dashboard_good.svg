<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f7f8f4"/>
  <rect x="20" y="20" width="1160" height="70" rx="8" fill="#143642"/>
  <text x="50" y="65" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">PM2.5 Monitoring - Priorisierung der Standorte</text>
  <rect x="30" y="120" width="280" height="240" rx="10" fill="#ffffff" stroke="#cfd8d4"/>
  <text x="50" y="155" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#143642">Heute kritisch</text>
  <text x="50" y="225" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#c44536">12</text>
  <text x="50" y="265" font-family="Arial, sans-serif" font-size="20" fill="#43555f">Standorte über 35 µg/m³</text>
  <text x="50" y="315" font-family="Arial, sans-serif" font-size="18" fill="#43555f">Kontext: Grenzwert der Stadt</text>
  <rect x="340" y="120" width="830" height="240" rx="10" fill="#ffffff" stroke="#cfd8d4"/>
  <text x="370" y="155" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#143642">Standort Berlin-Mitte</text>
  <text x="370" y="185" font-family="Arial, sans-serif" font-size="18" fill="#43555f">PM2.5 [µg/m³] - letzte 24 Stunden</text>
  <line x1="400" y1="300" x2="1120" y2="300" stroke="#8aa29e" stroke-width="2"/>
  <line x1="430" y1="315" x2="430" y2="170" stroke="#8aa29e" stroke-width="2"/>
  <line x1="430" y1="220" x2="1120" y2="220" stroke="#c44536" stroke-width="3" stroke-dasharray="10 8"/>
  <polyline fill="none" stroke="#2d6a4f" stroke-width="5" points="430,270 500,250 570,255 640,235 710,245 780,210 850,215 920,195 990,210 1060,185 1120,205"/>
  <text x="1130" y="225" font-family="Arial, sans-serif" font-size="17" fill="#c44536">Grenzwert 35</text>
  <text x="440" y="335" font-family="Arial, sans-serif" font-size="18" fill="#43555f">Eine zentrale Zeitreihe, klare Beschriftung, sichtbarer Grenzwert</text>
  <rect x="30" y="390" width="560" height="260" rx="10" fill="#ffffff" stroke="#cfd8d4"/>
  <text x="50" y="425" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#143642">Top 3 Standorte</text>
  <rect x="50" y="445" width="520" height="42" rx="6" fill="#eef3ef"/>
  <text x="70" y="472" font-family="Arial, sans-serif" font-size="18" fill="#143642">1. Berlin-Mitte</text>
  <text x="360" y="472" font-family="Arial, sans-serif" font-size="18" fill="#143642">41 µg/m³</text>
  <rect x="50" y="500" width="520" height="42" rx="6" fill="#f5f7f3"/>
  <text x="70" y="527" font-family="Arial, sans-serif" font-size="18" fill="#143642">2. Potsdam-Nord</text>
  <text x="360" y="527" font-family="Arial, sans-serif" font-size="18" fill="#143642">39 µg/m³</text>
  <rect x="50" y="555" width="520" height="42" rx="6" fill="#eef3ef"/>
  <text x="70" y="582" font-family="Arial, sans-serif" font-size="18" fill="#143642">3. Werder</text>
  <text x="360" y="582" font-family="Arial, sans-serif" font-size="18" fill="#143642">37 µg/m³</text>
  <rect x="620" y="390" width="550" height="260" rx="10" fill="#ffffff" stroke="#cfd8d4"/>
  <text x="640" y="425" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#143642">Filter</text>
  <text x="640" y="470" font-family="Arial, sans-serif" font-size="18" fill="#43555f">Standort</text>
  <rect x="640" y="482" width="220" height="44" rx="6" fill="#f5f7f3" stroke="#cfd8d4"/>
  <text x="660" y="510" font-family="Arial, sans-serif" font-size="18" fill="#143642">Berlin-Mitte</text>
  <text x="640" y="560" font-family="Arial, sans-serif" font-size="18" fill="#43555f">Schwellenwert [µg/m³]</text>
  <line x1="640" y1="600" x2="1020" y2="600" stroke="#8aa29e" stroke-width="6"/>
  <circle cx="910" cy="600" r="14" fill="#2d6a4f"/>
  <text x="1040" y="607" font-family="Arial, sans-serif" font-size="18" fill="#143642">35</text>
</svg>
