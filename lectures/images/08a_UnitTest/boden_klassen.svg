<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" font-family="DIN Pro Regular,DIN Pro Regular_MSFontService,sans-serif" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0" width="560" height="220">
<style>svg{display:block;}text{font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0}</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#302F2B"/></marker></defs>
<rect x="20" y="20" width="180" height="120" fill="#CFE3C2" stroke="#302F2B" stroke-width="3"/>
<text x="110.0" y="56" font-size="22" text-anchor="middle" fill="#302F2B" font-weight="bold" style="font-variant-ligatures:none">Sauber</text>
<text x="110.0" y="86" font-size="20" text-anchor="middle" fill="#302F2B" style="font-variant-ligatures:none">wert &lt; 50</text>
<text x="110.0" y="118" font-size="16" text-anchor="middle" fill="#302F2B" style="font-variant-ligatures:none">kein Handlungsbedarf</text>
<rect x="200" y="20" width="180" height="120" fill="#FBE9A8" stroke="#302F2B" stroke-width="3"/>
<text x="290.0" y="56" font-size="22" text-anchor="middle" fill="#302F2B" font-weight="bold" style="font-variant-ligatures:none">Beobachten</text>
<text x="290.0" y="86" font-size="20" text-anchor="middle" fill="#302F2B" style="font-variant-ligatures:none">50 ≤ wert &lt; 150</text>
<text x="290.0" y="118" font-size="16" text-anchor="middle" fill="#302F2B" style="font-variant-ligatures:none">nachmessen</text>
<rect x="380" y="20" width="160" height="120" fill="#F4C7C0" stroke="#302F2B" stroke-width="3"/>
<text x="460.0" y="56" font-size="22" text-anchor="middle" fill="#302F2B" font-weight="bold" style="font-variant-ligatures:none">Kritisch</text>
<text x="460.0" y="86" font-size="20" text-anchor="middle" fill="#302F2B" style="font-variant-ligatures:none">wert ≥ 150</text>
<text x="460.0" y="118" font-size="16" text-anchor="middle" fill="#302F2B" style="font-variant-ligatures:none">Maßnahmen prüfen</text>
