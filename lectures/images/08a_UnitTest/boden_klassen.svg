<text x="200" y="192" font-size="20" text-anchor="middle" fill="#302F2B" style="font-variant-ligatures:none">50</text>
<text x="380" y="192" font-size="20" text-anchor="middle" fill="#302F2B" style="font-variant-ligatures:none">150</text>
