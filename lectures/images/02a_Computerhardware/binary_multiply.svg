<svg id="svg-multiply" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" width="560" height="400" font-family="'DIN Pro','DINPro',Arial,sans-serif" style="cursor:pointer" onclick="bmNext()">
  <style>
    .lbl { font-size:13px; fill:var(--concrete, #6F7479); text-anchor:end;    dominant-baseline:middle; }
    .hdr { font-size:11px; fill:var(--rebar, #A9ADB2); text-anchor:middle; dominant-baseline:middle; }
    .n   { font-size:16px; font-weight:500; fill:var(--ink, #0B0D10);    text-anchor:middle; dominant-baseline:middle; }
    .na  { font-size:16px; font-weight:500; fill:var(--signal-blue, #1E40FF); text-anchor:middle; dominant-baseline:middle; }
    .ng  { font-size:16px; font-weight:500; fill:var(--rebar, #A9ADB2);    text-anchor:middle; dominant-baseline:middle; }
    .nk  { font-size:16px; font-weight:500; fill:var(--signal-green, #1E9E4A); text-anchor:middle; dominant-baseline:middle; }
    .ann { font-size:11px; fill:var(--ink, #0B0D10); text-anchor:start; dominant-baseline:middle; }
    .ann2{ font-size:11px; fill:var(--rebar, #A9ADB2);    text-anchor:start; dominant-baseline:middle; }
    .st  { font-size:12px; fill:var(--concrete, #6F7479); text-anchor:middle; dominant-baseline:middle; }
    .dec { font-size:13px; fill:var(--ink, #0B0D10); dominant-baseline:middle; }
  </style>

  <!-- headers -->
  <text class="hdr" x="200" y="20">Bit 4</text>
  <text class="hdr" x="240" y="20">Bit 3</text>
  <text class="hdr" x="280" y="20">Bit 2</text>
  <text class="hdr" x="320" y="20">Bit 1</text>
  <text class="hdr" x="360" y="20">Bit 0</text>

  <!-- row labels -->
  <text class="lbl" x="148" y="65">A = 3</text>
  <text class="lbl" x="148" y="105">B = 5</text>
  <text class="lbl" x="148" y="210">A &lt;&lt; 0 = ×1</text>
  <text class="lbl" x="148" y="250">A &lt;&lt; 1 = ×2</text>
  <text class="lbl" x="148" y="290">A &lt;&lt; 2 = ×4</text>
  <text class="lbl" x="148" y="347">= 15</text>

  <!-- separators -->
  <line x1="152" y1="127" x2="384" y2="127" stroke="var(--plaster, #D7DADD)" stroke-width="1.5"/>
  <line x1="152" y1="175" x2="384" y2="175" stroke="var(--plaster, #D7DADD)" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="152" y1="312" x2="384" y2="312" stroke="var(--plaster, #D7DADD)" stroke-width="1.5"/>

  <!-- A = 00011 -->
  <rect x="184" y="49" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="n" x="200" y="65">0</text>
  <rect x="224" y="49" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="n" x="240" y="65">0</text>
  <rect x="264" y="49" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="n" x="280" y="65">0</text>
  <rect x="304" y="49" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="n" x="320" y="65">1</text>
  <rect x="344" y="49" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="n" x="360" y="65">1</text>

  <!-- B = 00101, Bit0 and Bit2 yellow (static) -->
  <rect x="184" y="89" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="n" x="200" y="105">0</text>
  <rect x="224" y="89" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="n" x="240" y="105">0</text>
  <rect x="264" y="89" width="32" height="32" rx="4" fill="var(--signal-yellow-50, #FAE280)" stroke="var(--signal-yellow, #F5C400)" stroke-width="0.75"/><text class="n" fill="var(--ink, #0B0D10)" x="280" y="105">1</text>
  <rect x="304" y="89" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="n" x="320" y="105">0</text>
  <rect x="344" y="89" width="32" height="32" rx="4" fill="var(--signal-yellow-50, #FAE280)" stroke="var(--signal-yellow, #F5C400)" stroke-width="0.75"/><text class="n" fill="var(--ink, #0B0D10)" x="360" y="105">1</text>

  <!-- decomposition: 3 lines, "=" aligned -->
  <text class="dec" x="230" y="138" text-anchor="end">5</text>
  <text class="dec" x="232" y="138" text-anchor="start">= 2² + 2⁰ = 4 + 1</text>
  <text class="dec" x="230" y="154" text-anchor="end">3×5</text>
  <text class="dec" x="232" y="154" text-anchor="start">= 3×4 + 3×1</text>
  <text class="dec" x="230" y="170" text-anchor="end">3×5</text>
  <text class="dec" x="232" y="170" text-anchor="start">= (3&lt;&lt;2) + (3&lt;&lt;0)</text>

  <!-- B bit highlights (opacity=0, GSAP only) -->
  <g id="bm-bhi0" opacity="0"><rect x="344" y="89" width="32" height="32" rx="4" fill="var(--signal-yellow-50, #FAE280)" stroke="var(--signal-yellow, #F5C400)" stroke-width="1.5"/></g>
  <g id="bm-bhi1" opacity="0"><rect x="304" y="89" width="32" height="32" rx="4" fill="var(--signal-red-50, #F0938E)" stroke="var(--signal-red, #E1261C)" stroke-width="1.5"/></g>
  <g id="bm-bhi2" opacity="0"><rect x="264" y="89" width="32" height="32" rx="4" fill="var(--signal-yellow-50, #FAE280)" stroke="var(--signal-yellow, #F5C400)" stroke-width="1.5"/></g>

  <!-- shift rows: opacity=1 (end state for Typst) -->
  <!-- P0: A<<0 = 00011, active bits 3,4 -->
  <g id="bm-p0">
    <rect x="184" y="194" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="ng" x="200" y="210">0</text>
    <rect x="224" y="194" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="ng" x="240" y="210">0</text>
    <rect x="264" y="194" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="ng" x="280" y="210">0</text>
    <rect x="304" y="194" width="32" height="32" rx="4" fill="var(--signal-blue-50, #8FA0FF)" stroke="var(--signal-blue, #1E40FF)" stroke-width="0.75"/><text class="na" x="320" y="210">1</text>
    <rect x="344" y="194" width="32" height="32" rx="4" fill="var(--signal-blue-50, #8FA0FF)" stroke="var(--signal-blue, #1E40FF)" stroke-width="0.75"/><text class="na" x="360" y="210">1</text>
    <text class="ann" x="388" y="210">+ (B[0]=1, ×1)</text>
  </g>

  <!-- P1: A<<1 = 00110, skipped -->
  <g id="bm-p1">
    <rect x="184" y="234" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="#eee" stroke-width="0.75"/><text class="ng" x="200" y="250">0</text>
    <rect x="224" y="234" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="#eee" stroke-width="0.75"/><text class="ng" x="240" y="250">0</text>
    <rect x="264" y="234" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="#eee" stroke-width="0.75"/><text class="ng" x="280" y="250">1</text>
    <rect x="304" y="234" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="#eee" stroke-width="0.75"/><text class="ng" x="320" y="250">1</text>
    <rect x="344" y="234" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="#eee" stroke-width="0.75"/><text class="ng" x="360" y="250">0</text>
    <text class="ann2" x="388" y="250">– (B[1]=0, ×2)</text>
  </g>

  <!-- P2: A<<2 = 01100, active bits 1,2 -->
  <g id="bm-p2">
    <rect x="184" y="274" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="ng" x="200" y="290">0</text>
    <rect x="224" y="274" width="32" height="32" rx="4" fill="var(--signal-blue-50, #8FA0FF)" stroke="var(--signal-blue, #1E40FF)" stroke-width="0.75"/><text class="na" x="240" y="290">1</text>
    <rect x="264" y="274" width="32" height="32" rx="4" fill="var(--signal-blue-50, #8FA0FF)" stroke="var(--signal-blue, #1E40FF)" stroke-width="0.75"/><text class="na" x="280" y="290">1</text>
    <rect x="304" y="274" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="ng" x="320" y="290">0</text>
    <rect x="344" y="274" width="32" height="32" rx="4" fill="var(--paper, #F7F8F9)" stroke="var(--plaster, #D7DADD)" stroke-width="0.75"/><text class="ng" x="360" y="290">0</text>
    <text class="ann" x="388" y="290">+ (B[2]=1, ×4)</text>
  </g>

  <!-- result: opacity=1 (end state for Typst) -->
  <g id="bm-result">
    <rect x="184" y="331" width="32" height="32" rx="4" fill="var(--signal-green-50, #8FCFA5)" stroke="var(--signal-green, #1E9E4A)" stroke-width="0.75"/><text class="nk" x="200" y="347">0</text>
    <rect x="224" y="331" width="32" height="32" rx="4" fill="var(--signal-green-50, #8FCFA5)" stroke="var(--signal-green, #1E9E4A)" stroke-width="0.75"/><text class="nk" x="240" y="347">1</text>
    <rect x="264" y="331" width="32" height="32" rx="4" fill="var(--signal-green-50, #8FCFA5)" stroke="var(--signal-green, #1E9E4A)" stroke-width="0.75"/><text class="nk" x="280" y="347">1</text>
    <rect x="304" y="331" width="32" height="32" rx="4" fill="var(--signal-green-50, #8FCFA5)" stroke="var(--signal-green, #1E9E4A)" stroke-width="0.75"/><text class="nk" x="320" y="347">1</text>
    <rect x="344" y="331" width="32" height="32" rx="4" fill="var(--signal-green-50, #8FCFA5)" stroke="var(--signal-green, #1E9E4A)" stroke-width="0.75"/><text class="nk" x="360" y="347">1</text>
  </g>

  <text id="bm-status" class="st" x="270" y="385">3 × 5 = 01111 = 15 ✓</text>
</svg>
