worktree:
  # Each entry must be a gitignored directory in the main checkout. Files, links and folders
  # with tracked content (.claude, .opencode, .vscode) are silently skipped by Orca.
  # Not shared: .venv.nosync (editable install of cli/tasks -> own venv per worktree, see
  # scripts/worktree-setup.sh), lectures/.quarto and _build (per-render output).
  sharedDirectories:
    - .claude/skills
    - .opencode/skills
    - .opencode/node_modules.nosync
    - lectures/_extensions
    - lectures/old
    - lectures/oldx
    - _static/pdf
    # Execution caches: safe to share as long as parallel agents work on different decks.
    # The links lectures/_freeze and lectures/.jupyter_cache are recreated by the setup script.
    - lectures/_freeze.nosync
    - lectures/.jupyter_cache.nosync
scripts:
  setup: |
    bash "$ORCA_WORKTREE_PATH/scripts/worktree-setup.sh"
setupAgentStartupPolicy: wait-for-setup
