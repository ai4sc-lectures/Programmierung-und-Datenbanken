<text x="560" y="118" font-family="Protomolecule, 'Space Grotesk', sans-serif" font-size="40" font-weight="400" fill="#000000" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">RECHNER &amp; DATEN</text>
<text x="560" y="166" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">Wie arbeitet ein Computer mit Daten?</text>
<text x="1484" y="118" font-family="Protomolecule, 'Space Grotesk', sans-serif" font-size="40" font-weight="400" fill="#000000" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">SOFTWAREENTWURF</text>
<text x="1484" y="166" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">Wie entwerfe ich Software für eine Aufgabe?</text>
<text x="1484" y="584" font-family="Protomolecule, 'Space Grotesk', sans-serif" font-size="40" font-weight="400" fill="#000000" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">AGENTIC CODING</text>
<text x="1484" y="632" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">Wie lese und ändere ich KI-generierten Code?</text>
<text x="560" y="584" font-family="Protomolecule, 'Space Grotesk', sans-serif" font-size="40" font-weight="400" fill="#000000" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">FEHLER &amp; TESTS</text>
<text x="560" y="632" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">Woher weiß ich, dass das Ergebnis stimmt?</text>
<text x="560" y="1050" font-family="Protomolecule, 'Space Grotesk', sans-serif" font-size="40" font-weight="400" fill="#000000" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">ALGORITHMEN</text>
<text x="560" y="1098" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">Wie löse ich Probleme Schritt für Schritt?</text>
<text x="1946" y="1050" font-family="Protomolecule, 'Space Grotesk', sans-serif" font-size="40" font-weight="400" fill="#000000" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">DATEN &amp; DATENBANKEN</text>
<text x="1946" y="1098" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">Wie verwalte ich große Datenmengen?</text>
<rect x="2831" y="190" width="112" height="112" fill="#404040"/>
<text x="2971" y="230" font-family="Protomolecule, 'Space Grotesk', sans-serif" font-size="44" font-weight="400" fill="#000000" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">VORLESUNG</text>
<text x="2971" y="290" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">Die Vorlesung erklärt Konzepte</text>
<text x="2971" y="340" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">und zeigt sie an</text>
<text x="2971" y="390" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">Beispielen aus dem Bauwesen.</text>
<rect x="2831" y="530" width="112" height="112" fill="#767171"/>
<text x="2971" y="570" font-family="Protomolecule, 'Space Grotesk', sans-serif" font-size="44" font-weight="400" fill="#000000" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">ÜBUNG</text>
<text x="2971" y="630" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">In der Übung wenden Sie sie</text>
<text x="2971" y="680" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">an praktischen</text>
<text x="2971" y="730" font-family="DINPro, 'DIN Pro', Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="400" fill="#595959" text-anchor="start" style="font-variant-ligatures:none;font-feature-settings:'liga' 0,'clig' 0">Ingenieuraufgaben an.</text>
